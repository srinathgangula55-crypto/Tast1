<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // =============================For Loop==================================
        // -----------print 1-5-------------

        for (let i = 1; i <= 5; i++) {
            console.log(i);
        }

        // -----------print odd number-------------

        for (let i = 1; i <= 7; i += 2) {
            console.log(i);
        }

        // ============================================While loop======================================
        // ------------------------print 1-5-----------------
        let i = 1;

        while (i <= 5) {
            console.log(i);
            i++;
        }

        // ------------------------print 5-1-----------------
        let I = 5;

        while (I >= 1) {
            console.log(I);
            I--;
        }

        // =================================================do while loop==========================
        // ------------------------print 1-5-----------------
        let a = 1;

        do {
            console.log(a);
            a++;
        }
        while (a <= 5);

        // ------------------------print atleast once-----------------

        let num = 20;

        do {
            console.log(num);
        }
        while (num < 5);

        // ================================================for of==============================
        // ------------------------arrey values-------------
        let sports = ["Cricket", "Kabaddi", "Foodball"];

        for (let sport of sports) {
            console.log(sport);
        }

        // ---------------------------String-----------------
        let name = "Srinath";

        for (let letter of name) {
            console.log(letter);
        }

        // ====================================================for in===============================
        // ------------------object--------------------------
        let student = {
            id: 121,
            name: "Srinath",
            course: "JavaScript"
        };

        for (let key in student) {
            console.log(key);
        }
        // --------------------------print values--------------------
        let Student = {
            id: 121,
            name: "Srinath",
            course: "JavaScript"
        };

        for (let key in Student) {
            console.log(Student[key]);
        }
        // ====================================For each====================================
        // -----------------------print arrey values-----------------
        let Companies = ["Wipro", "TCS", "Google"];

        Companies.forEach(function (Company) {
            console.log(Company);
        });

        // --------------------------print numbers----------------------------------
        let numbers = [10, 20, 33];

        numbers.forEach(function (num) {
            console.log(num);
        });




        // ==========================================Realtime Scenario Student Data===============

        let students = [
            { id: 101, name: "Srinath", marks: 90 },
            { id: 102, name: "Ravi", marks: 75 },
            { id: 103, name: "Rani", marks: 80 }
        ];
        for (let i = 0; i < students.length; i++) {
            console.log(students[i].name);
        }
    </script>
</body>

</html>
