<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const movies = [
            { id: 1, title: "Bahubali", rating: 9 },
            { id: 2, title: "Pushpa", rating: 8 },
            { id: 3, title: "RRR", rating: 10 },
            { id: 4, title: "Salaar", rating: 7 }
        ];

        // ----------1.Create a new array containing only movie titles.----
        let titles = movies.map(movie => movie.title);
        console.log(titles);

        // ----------2. Create a new array containing only movie ratings.-------------
        let ratings = movies.map(movie => movie.rating);
        console.log(ratings);

        // ----------3. Increase every movie rating by 1.-------------
        let updateRatings = movies.map(movie => movie.rating + 1);
        console.log(updateRatings);

        // ----------4. Get all movies with rating greater than 8.----------
        let highRatedMovies = movies.filter(movie => movie.rating > 8);
        console.log(highRatedMovies);

        // ----------5. Get all movies with rating less than 9.--------------
        let moviesBelow9 = movies.filter(movie => movie.rating < 9);
        console.log(moviesBelow9);

        // -----------6. Find the movie with ID 3.-------------------------
        let movie = movies.find(movie => movie.id === 3);
        console.log(movie);

        // -----------7. Find the movie with title “Pushpa”.-----------------
        let pushpa = movies.find(movie => movie.title === "Pushpa");
        console.log(pushpa);

        // ------------8. Calculate the total of all movie ratings.------------
        let totalRatings = movies.reduce((sum, movie) => sum + movie.rating, 0);
        console.log(totalRatings);





        // ==================Dataset 2: Products=====================

        const products = [
            { id: 1, name: "Laptop", price: 50000 },
            { id: 2, name: "Mouse", price: 500 },
            { id: 3, name: "Keyboard", price: 1500 },
            { id: 4, name: "Monitor", price: 12000 }
        ];

        // --------------9. Create an array containing only product names.------------------
        let productNames = products.map(product => product.name);
        console.log(productNames);

        // --------------10. Create an array containing only product prices.---------------
        let productPrices = products.map(product => product.price);
        console.log(productPrices);

        // ---------------11. Increase every product price by ₹1000.----------------------
        let updatedPrices = products.map(product => product.price + 1000);
        console.log(updatedPrices);

        // ----------------12. Get all products costing more than ₹1000.-------------------
        let expensiveProducts = products.filter(product => product.price > 1000);
        console.log(expensiveProducts);

        // -----------------13. Get all products costing less than ₹10000.-------------------
        let cheapProducts = products.filter(product => product.price < 10000);
        console.log(cheapProducts);

        // ------------------14. Find the product with ID 2.--------------------
        let product = products.find(product => product.id === 2);
        console.log(product);

        // -------------------15. Find the product named “Monitor”.-------------
        let monitor = products.find(product => product.name === "Monitor");
        console.log(monitor);

        // -------------------16. Calculate the total cost of all products.---------------
        let totalCost = products.reduce((sum, product) => sum + product.price, 0);
        console.log(totalCost);




        // ==========================Dataset 3: Cricket Scores=======================

        const scores = [45, 80, 20, 100, 60];

        // -------------------17. Add 10 runs to every score.--------------------------
        let updatedScores = scores.map(score => score + 10);
        console.log(updatedScores);

        // -------------------18. Add 5 runs to every score.------------------------
        let updatedScore = scores.map(score => score + 5);
        console.log(updatedScore);

        // -------------------19. Get all scores greater than 50.-----------------------
        let result = scores.filter(score => score > 50);
        console.log(result);

        // -------------------20. Get all scores greater than or equal to 80.-----------------
        let results = scores.filter(score => score >= 80);
        console.log(results);

        // -------------------21. Find the first score greater than 70.---------------------
        let Result = scores.find(score => score > 70);
        console.log(Result);

        // -------------------22. Find the first score equal to 100.-------------------
        let REsult = scores.find(score => score === 100);
        console.log(REsult);

        // -------------------23. Calculate the total runs scored.----------------------
        let totalRuns = scores.reduce((sum, score) => sum + score, 0);
        console.log(totalRuns);

        // --------------------24. Calculate the average score.----------------------
        let average = scores.reduce((sum, score) => sum + score, 0) / scores.length;
        console.log(average);




        // =============================Dataset 4: Students=============================================
        const students = [
            { name: "Ravi", marks: 90 },
            { name: "Priya", marks: 75 },
            { name: "Rahul", marks: 40 },
            { name: "Anu", marks: 95 }
        ];
        // ---------------------25. Create an array containing only student names.------------------
        let names = students.map(student => student.name);
        console.log(names);

        // ---------------------26. Create an array containing only student marks.--------------------
        let marks = students.map(student => student.marks);
        console.log(marks);

        // ---------------------27. Add 5 marks to every student.--------------------------------
        let updatedMarks = students.map(student => student.marks + 5);
        console.log(updatedMarks);

        // ---------------------28. Get students who scored above 80.------------------------
        let toppers = students.filter(student => student.marks > 80);
        console.log(toppers);

        // ----------------------29. Get students who scored below 50.-------------------------
        let failedStudents = students.filter(student => student.marks < 50);
        console.log(failedStudents);

        // ----------------------30. Find the student named “Rahul”.-------------------------
        let student = students.find(student => student.name === "Rahul");
        console.log(student);

        // -----------------------31. Find the first student who scored above 90.-------------------
        let topper = students.find(student => student.marks > 90);
        console.log(topper);

        // -----------------------32. Calculate the total marks of all students.-----------------------
        let totalMarks = students.reduce((sum, student) => sum + student.marks, 0);
        console.log(totalMarks);



        
        // ======================================Dataset 5: Food Orders=====================================
        const foodOrders = [
            { item: "Pizza", price: 300 },
            { item: "Burger", price: 150 },
            { item: "Biryani", price: 250 },
            { item: "Ice Cream", price: 100 }
        ];

        // -----------------------33. Create an array containing only food item names.-------------------
        let foodNames = foodOrders.map(food => food.item);
        console.log(foodNames);

        // ------------------------34. Create an array containing only food prices.-----------------
        let foodPrices = foodOrders.map(food => food.price);
        console.log(foodPrices);

        // ------------------------35. Increase every food price by ₹50.--------------------------
        let UPdatedPrices = foodOrders.map(food => food.price + 50);
        console.log(UPdatedPrices);

        // ------------------------36. Get all food items costing more than ₹200.-------------------
        let expensiveFoods = foodOrders.filter(food => food.price > 200);
        console.log(expensiveFoods);

        // ------------------------37. Get all food items costing less than ₹250.------------------
        let cheapFoods = foodOrders.filter(food => food.price < 250);
        console.log(cheapFoods);

        // ------------------------38. Find the food item “Biryani”.-----------------------------
        let biryani = foodOrders.find(food => food.item === "Biryani");
        console.log(biryani);

        // ------------------------39. Find the first food item costing more than ₹250.----------------
        let RESULT = foodOrders.find(food => food.price > 250);
        console.log(RESULT);

        // -------------------------40. Calculate the total food bill.------------------------
        let totalBill = foodOrders.reduce((sum, food) => sum + food.price, 0);
        console.log(totalBill);




        // =========================================Bonus Tasks===============================
        
        // --------------------------41. Create an array of movie titles in uppercase.--------------------
        let upperMovies = movies.map(movie => movie.title.toUpperCase());
        console.log(upperMovies);

        // --------------------------42. Create an array of product names in lowercase.-----------------------
        let lowerProducts = products.map(product => product.name.toLowerCase());
        console.log(lowerProducts);

        // --------------------------43. Get all students whose names start with “R”.---------------------------
        let studentsWithR = students.filter(student => student.name.startsWith("R"));
        console.log(studentsWithR);

        // --------------------------44. Get all movies whose title length is greater than 5.-----------------------
        let longMovies = movies.filter(movie => movie.title.length > 5);
        console.log(longMovies);

        // --------------------------45. Calculate the combined total of all cricket scores and all student marks.---------------------
        let totalScores = scores.reduce((sum, score) => sum + score, 0);
        let TotalMarks = students.reduce((sum, student) => sum + student.marks, 0);
        console.log(totalScores + TotalMarks);

        // --------------------------46. Find the most expensive product.------------------------
        let expensiveProduct = products.reduce((max, product) => product.price > max.price ? product : max);
        console.log(expensiveProduct);

        // --------------------------47. Find the highest cricket score.-----------------------------
        let highestScore = scores.reduce((max, score) => score > max ? score : max);
        console.log(highestScore);

        // --------------------------48. Find the student with the highest marks.--------------------
        let Topper = students.reduce((Topper, student) => student.marks > Topper.marks ? student : Topper);
        console.log(Topper);


        // ---------------------------49. Find the movie with the highest rating.------------------------
        let bestMovie = movies.reduce((best, movie) => movie.rating > best.rating ? movie : best);
        console.log(bestMovie);





        // =========================================50. Create your own dataset and write 5 custom operations on it.=======================================
        const mobiles = [
            { id: 1, brand: "Samsung", price: 25000 },
            { id: 2, brand: "Apple", price: 80000 },
            { id: 3, brand: "OnePlus", price: 35000 },
            { id: 4, brand: "Realme", price: 18000 }
        ];


        // ------------------------------get all mobile brands=map------------------
        console.log(
            mobiles.map(mobile => mobile.brand)
        );

        // -------------------------------increase mobile price by 5000=map---------------
        console.log(
            mobiles.map(mobile => mobile.price + 5000)
        );

        // --------------------------------Cost more than 30000=filter------------------
        console.log(
            mobiles.filter(mobile => mobile.price > 30000)
        );

        // --------------------------------Find Apple Mobile=find------------------
        console.log(
            mobiles.find(mobile => mobile.brand === "Apple")
        );

        // ---------------------------------Total Mobile Cost=reduce---------------------
        console.log(
            mobiles.reduce((sum, mobile) => sum + mobile.price, 0));





        // =================================JavaScript String Concepts=================

        // --------------------------1.toUpperCase()----------------------
        let name = "srinath";
        console.log(name.toUpperCase());

        let A = "gangula"
        console.log(A.toUpperCase());

        // --------------------------2.toLowerCase()---------------------
        let NAme = "Reddy";
        console.log(NAme.toLowerCase());

        let NAAme = "REDDY";
        console.log(NAAme.toLowerCase());
        // --------------------------3.charAt()-------------------------

        console.log(name.charAt(2));
        console.log(name.charAt(3));

        // --------------------------4.slice()---------------------------

        console.log(name.slice(0, 3));
        console.log(name.slice(-4));
        console.log(name.slice(-5, -2));

        // --------------------------5.substring()------------------------

        console.log(name.substring(3, 0));
        console.log(name.substring(2, 1))

        // --------------------------6.replace()---------------------

        let text = "I like Cricket";
        console.log(text.replace("Cricket", "Movies"));
        let TText = "I like Movies";
        console.log(TText.replace("Movies", "Cricket"));

        // --------------------------7.trim()------------------------

        let Name = "   Srinath   ";
        console.log(Name.trim());
        let Player = "   Virat Kohli   ";
        console.log(Player.trim());


        // --------------------------8.split()------------------------

        let Text = "Java,HTML,CSS";
        console.log(Text.split(","));
        let players = "Virat,Rohit,Dhoni";
        console.log(players.split(","));

        // --------------------------9.concat()------------------------

        let firstName = "Srinath";
        let lastName = "Reddy";
        console.log(firstName.concat(" ", lastName));
        let FirstName = "Virat";
        let LastName = "Kohli";
        console.log(FirstName.concat(" ", LastName));

        // --------------------------10.Repeat()-------------------------

        let TEXT = "Srinath ";
        console.log(TEXT.repeat(3));
        let PLayer = "Virat ";
        console.log(PLayer.repeat(4));

        // ---------------------------11.indexOf()-----------------------

        console.log(name.indexOf("n"));
        console.log(name.indexOf("s"));


        // ---------------------------12.startsWith()---------------------

        console.log(name.startsWith("Sri"));
        console.log(name.startsWith("sri"));

        // ----------------------------13.endWith()-------------------------

        console.log(name.endsWith("ath"));
        console.log(name.endsWith("Ath"));

        // -----------------------------14.length()-------------------------

        console.log(name.length);
        let Team = "India";
        console.log(Team.length);

        // -----------------------------15.includes()------------------------

        console.log(name.includes("nat"));
        console.log(Team.includes("nat"));

        // --------------------------------16.replaceAll------------------------

        let a = "Ramu is a Cricket batstman. Ramu is also a wicketkeeper .";
        let b = a.replaceAll("Ramu", "Srinath");
        console.log(b);

        let data = "Apple,Banana,Mango,Orange";
        let c = data.replaceAll(",", " | ");
        console.log(c);

        // -------------------------------17.trimStart()-------------------------

        let player = "   MS Dhoni";
        console.log(player.trimStart());

        let team = "    India";
        console.log(team.trimStart());

        // -------------------------------18.trimEnd()---------------------------

        let stadium = "Wankhede Stadium    ";
        console.log(stadium.trimEnd());

        let captain = "Rohit Sharma     ";
        console.log(captain.trimEnd());

        // ---------------------------------19.charCodeAt()--------------------------
        console.log(player.charCodeAt(0));
        console.log(player.charCodeAt(3));
    </script>
</body>

</html>
