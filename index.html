    <script>
    // ============================Using if else====================================================
let signal = "Yellow";

if(signal === "Red"){
    console.log("Stop Immediately");
}
else if(signal === "Yellow"){
    console.log("Slow down and prepare to stop");
}
else if(signal === "Green"){
    console.log("Go Safely");
}
else{
    console.log("Invalid Signal");
}

// ================================using Swith===============================================
 let Signal = "Green";

switch(Signal){

case "Red":
        console.log("Stop Immediately");
        break;

case "Yellow":
        console.log("Slow down and prepare to stop");
        break;

case "green":
        console.log("Go Safely");
        break;

default:
        console.log("Invalid Signal");
}

// ===============================Switch operator months in every season====================
console.log("Switch operator months in every season");
let month = "July";

switch(month){

    case "March":
    case "April":
    case "May":
    case "June":
        console.log("Summer Season");
        break;

    case "July":
    case "August":
    case "September":
    case "October":
        console.log("Rainy Season");
        break;

    case "November":
    case "December":
    case "January":
    case "February":
        console.log("Winter Season");
        break;

    default:
        console.log("Invalid Month");
}

// ===============================Switch operator based Month Number====================
