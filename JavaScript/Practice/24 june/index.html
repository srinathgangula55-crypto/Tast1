<!DOCTYPE html>
<html>

<head>

    <title>Pizza Order</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>🍕 Pizza Order System</h1>

        <div class="box">

            <h2>Select Pizza Size</h2>

            <button id="smallBtn">Small</button>

            <button id="mediumBtn">Medium</button>

            <button id="largeBtn">Large</button>

        </div>

        <div class="box">

            <h2>Select Crust</h2>

            <select id="crust">

                <option value="thin">
                    Thin
                </option>

                <option value="regular" selected>
                    Regular
                </option>

                <option value="stuffed">
                    Stuffed
                </option>

            </select>

        </div>

        <div class="box">

            <h2>Select Toppings</h2>

            <label>
                <input
                    type="checkbox"
                    value="cheese">
                Cheese
            </label>

            <label>
                <input
                    type="checkbox"
                    value="pepperoni">
                Pepperoni
            </label>

            <label>
                <input
                    type="checkbox"
                    value="mushrooms">
                Mushrooms
            </label>

            <label>
                <input
                    type="checkbox"
                    value="onions">
                Onions
            </label>

            <label>
                <input
                    type="checkbox"
                    value="peppers">
                Peppers
            </label>

            <label>
                <input
                    type="checkbox"
                    value="sausage">
                Sausage
            </label>

        </div>

        <div class="receipt">

            <h2 id="pizzaTitle">
                SMALL REGULAR PIZZA
            </h2>

            <hr>

            <p>
                Base Price :
                <span id="basePrice">
                    $0.00
                </span>
            </p>

            <p>
                Toppings :
                <span id="toppingPrice">
                    $0.00
                </span>
            </p>

            <hr>

            <h2>
                Total :
                <span id="totalPrice">
                    $0.00
                </span>
            </h2>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
