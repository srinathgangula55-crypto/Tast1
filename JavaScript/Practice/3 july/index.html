<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>JavaScript Functions</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1 class="mainHeading">

        JavaScript Functions 

    </h1>

    <!-- ===============================
         1. Function Without Parameters
    ================================ -->

    <div class="card">

        <h2>1. Function Without Parameters</h2>

        <button id="balanceBtn">

            Check Balance

        </button>

        <h3 id="balanceResult"></h3>

    </div>

    <!-- ===============================
         2. Function With One Parameter
    ================================ -->

    <div class="card">

        <h2>2. Function With One Parameter</h2>

        <input
            type="number"
            id="rechargeAmount"
            placeholder="Enter Recharge Amount">

        <button id="rechargeBtn">

            Recharge

        </button>

        <h3 id="rechargeResult"></h3>

    </div>

    <!-- ===============================
         3. Function With Multiple Parameters
    ================================ -->

    <div class="card">

        <h2>3. Function With Multiple Parameters</h2>

        <input
            type="number"
            id="price1"
            placeholder="Product 1 Price">

        <input
            type="number"
            id="price2"
            placeholder="Product 2 Price">

        <button id="billBtn">

            Calculate Bill

        </button>

        <h3 id="billResult"></h3>

    </div>

    <!-- ===============================
         4. Default Parameters
    ================================ -->

    <div class="card">

        <h2>4. Default Parameters</h2>

        <input
            type="text"
            id="foodItem"
            placeholder="Food Item">

        <button id="foodBtn">

            Order Food

        </button>

        <h3 id="foodResult"></h3>

    </div>

    <!-- ===============================
         5. Form Validation
    ================================ -->

    <div class="card">

        <h2>5. Form Validation</h2>

        <input
            type="text"
            id="userName"
            placeholder="Enter Name">

        <button id="validateBtn">

            Validate

        </button>

        <h3 id="validateResult"></h3>

    </div>

    <!-- ===============================
         6. E-Commerce Discount
    ================================ -->

    <div class="card">

        <h2>6. E-Commerce Discount</h2>

        <input
            type="number"
            id="productPrice"
            placeholder="Product Price">

        <button id="discountBtn">

            Get Discount

        </button>

        <h3 id="discountResult"></h3>

    </div>

    <!-- ===============================
         7. Text Truncator
    ================================ -->

    <div class="card">

        <h2>7. Text Truncator</h2>

        <textarea
            id="longText"
            placeholder="Enter Long Text"></textarea>

        <button id="truncateBtn">

            Truncate

        </button>

        <h3 id="truncateResult"></h3>

    </div>

    <!-- ===============================
         8. Dice Roller
    ================================ -->

    <div class="card">

        <h2>8. Dice Roller</h2>

        <button id="diceBtn">

            Roll Dice

        </button>

        <h3 id="diceResult"></h3>

    </div>

    <!-- ===============================
         9. Currency Formatter
    ================================ -->

    <div class="card">

        <h2>9. Currency Formatter</h2>

        <input
            type="number"
            id="salary"
            placeholder="Enter Salary">

        <button id="salaryBtn">

            Format Salary

        </button>

        <h3 id="salaryResult"></h3>

    </div>

    <!-- ===============================
         10. Dynamic UI Updater
    ================================ -->

    <div
        class="card"
        id="themeCard">

        <h2>10. Dynamic UI Updater</h2>

        <button id="themeBtn">

            Change Theme

        </button>

    </div>

    <!-- ===============================
         11. Time Based Logic
    ================================ -->

    <div class="card">

        <h2>11. Time Based Greeting</h2>

        <button id="greetBtn">

            Show Greeting

        </button>

        <h3 id="greetResult"></h3>

    </div>

    <script src="script.js"></script>

</body>

</html>
